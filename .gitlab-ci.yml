image: $REPO_URL/stage

stages:
  - build
  - test
  - release

variables:
  DOCKER_HOST: tcp://localhost:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

default:
  before_script:
    - pip install -q --upgrade pip
    - pip install -q $END_TO_END_LIB@$CI_COMMIT_REF_NAME || pip install -q $END_TO_END_LIB
    - e2e init

###############################################################
# Build Stage (jobs inside a stage run in parallel)
###############################################################

dev-pypi:
  tags:
    - stage-kube-newer
  stage: build
  before_script:
    - pip3 install -q --upgrade pip build twine bump-my-version
    - pip install -q $END_TO_END_LIB@$CI_COMMIT_REF_NAME || pip install -q $END_TO_END_LIB
    - e2e init
  script:
    - bump-my-version bump --no-commit --no-tag local
    - python -m build
    - e2e release --dev --skip-tag

# ###############################################################
# # Test Stage
# ###############################################################

test-run38:
  stage: test
  tags:
    - stage-kube-newer
  image: python:3.8
  before_script:
    - pip install -U pip
    - pip install .[tests]
  script:
    - pip install -r requirements.txt
    - PYTHONPATH=. pytest -s -v

