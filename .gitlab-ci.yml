###############################################################
# Release Stage
###############################################################
release-pypi:
  stage: release
  tags:
    - stage-kube-newer
  script:
    - pip3 install -q packaging setuptools twine
    # release to internal pypi but do not tag yet
    - e2e release --skip-tag --remote https://github.com/polyswarm/polyswarm_engine.git
    # release to public pypi and tag
    - e2e release
      -u $PUBLIC_TWINE_USERNAME
      -p $PUBLIC_TWINE_PASSWORD
      -r $PUBLIC_TWINE_REPOSITORY_URL
      --remote https://github.com/polyswarm/polyswarm_engine.git
